# LLM-Kostenannahmen für die Tokenkostenanalyse.
#
# Diese Werte sind die offiziellen OpenAI-Listenpreise für gpt-4o-mini und
# dienen als Kostenbasis. Die berechneten Kosten sind LISTENPREISBASIERTE
# API-Kosten auf Basis REALER, gemessener Tokenusage (aus
# response.usage) — KEINE Rechnungspositionen aus dem Billing-Dashboard.
# Sie sind bewusst NICHT im Code hardcodiert.
#
# Preis-Check: am 2026-06-14 gegen die offizielle OpenAI GPT-4o mini
# Modell-/API-Dokumentation geprüft — Input 0.15 und Output 0.60 USD je 1M
# Tokens stimmen überein (Match). Offiziell existiert zusätzlich ein
# cached-input-Preis von 0.075 USD/1M Tokens; dieser wird hier bewusst NICHT
# verwendet (keine separate cached-input-Kostenlogik). Siehe
# docs/OPENAI_PRICE_CHECK.md.
#
# Einheit: Preis pro 1.000.000 Tokens (1M Tokens).
# Berechnung: cost = (tokens / 1_000_000) * price_per_1m_tokens

model_name: gpt-4o-mini
currency: USD
input_price_per_1m_tokens: 0.15
output_price_per_1m_tokens: 0.60
