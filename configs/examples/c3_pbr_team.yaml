# Condition C3: Perspective-Based Reading (PBR) Team
# Three reviewers with different perspectives: Tester, Designer, User

inspection_id: "c3_pbr_team_run_001"
condition: "C3_PBR_TEAM"

reading_techniques:
  - "PBR_TESTER"
  - "PBR_DESIGNER"
  - "PBR_USER"

artifacts:
  - "design/Taxi_des_exp_v2.pdf"
  - "usecases/UseCasesRank_v3.4.pdf"
  - "requirements/TextReqSpec_v3.6.pdf"

llm_params:
  provider: "openai"
  model: "gpt-5-mini"
  temperature: 0.2
  max_tokens: 4096

prompt_versions:
  reviewer_pbr_tester: "v1.0"
  reviewer_pbr_designer: "v1.0"
  reviewer_pbr_user: "v1.0"
  scribe_meeting: "v1.0"
  moderator_planning: "v1.0"
  moderator_followup: "v1.0"

dry_run: false

extra_config:
  description: "PBR team inspection with three complementary perspectives"
  focus_areas:
    - "Testability (Tester perspective)"
    - "Implementability (Designer perspective)"
    - "Usability (User perspective)"
  team_composition:
    - role: "Tester"
      focus: "Can the design be tested?"
    - role: "Designer"
      focus: "Can the design be implemented?"
    - role: "User"
      focus: "Does the design meet user needs?"
