# Experiment: COSTED UBR split-scope (soft), N=10
# Instrumentierter Ersatz für ubr_split_soft_n10 — identisches Setup, aber
# mit echter LLM-Tokenusage- und Laufzeit-Erfassung pro Call
# (runs/<run_id>/llm_usage.csv). Usage-Logging ist bei dry_run=false
# automatisch aktiv; keine Gold-Information fließt in den Run ein.
# Coverage variant with 10 reviewers, one primary anchor each.
#
# Each reviewer owns ONE of the ten relevant slices:
#   1) 3.1   2) 3.2.1   3) 3.2.2   4) 3.3.1   5) 3.3.2
#   6) 3.4.1 7) 3.4.2   8) 4.1     9) 4.2    10) Table 1
#
# "Soft" rule (in every reviewer_focus block): the reviewer keeps the
# primary anchor as their main task but MAY still log clear A/B
# (critical/important) defects encountered outside the anchor — with
# precise location and evidence. Within the anchor, defects of any risk
# (A/B/C) are in scope; outside, only A/B. This prevents critical
# cross-section findings (e.g. A8 "Cancel order" — 3.2.1 + 3.4.2 +
# Table 1) from falling through the cracks of strict division of labour.
#
# Table 1 is anchored to exactly one reviewer (R10) to avoid
# double-assignment; the soft rule still lets R1…R9 file obvious A/B
# Table-1 issues if they trip over one.

inspection_id: "costed_ubr_split_soft_n10"
condition: "C1_UBR"

reading_techniques:
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"
  - "UBR"

artifacts:
  - "design/Taxi_des_exp_v2.pdf"
  - "requirements/TextReqSpec_v3.6.pdf"
  - "usecases/UseCasesRank_v3.4.pdf"
  - "guides/GuideUBR_rankbased_v2.pdf"

llm_params:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 4096

prompt_versions:
  reviewer_ubr: "v1.0"
  scribe_meeting: "v1.0"
  moderator_planning: "v1.0"
  moderator_followup: "v1.0"

dry_run: false

extra_config:
  experiment_variant: "UBR_SPLIT_SOFT_N10"
  scope_mode: "split"
  ubr_variant: "RB-UBR"
  use_case_artifact: "usecases/UseCasesRank_v3.4.pdf"
  use_case_count: 19
  # Enable one-shot repair LLM call so expected/observed are always filled
  # or the defect is dropped. See docs/DEFECT_REPORT_QUALITY.md.
  record_quality_mode: "repair"
  description: "UBR split-scope (soft) with 10 reviewers — one section anchor each + A/B escape hatch."
  focus_areas:
    - "Message Sequence Charts (MSC) in sections 3.x and 4.x"
    - "Signal sequences and interface definitions"
    - "State transitions and message ordering"
    - "Design consistency and completeness"
    - "Requirements-to-Design consistency"
  reviewer_focus:
    - >
      YOUR ASSIGNED SCOPE: Section 3.1 (overall design structure, top-level signal flow).
      Concentrate on missing top-level signals, structural gaps between requirements and 3.1,
      and inconsistencies that propagate into the lower sections.
      Always cite the exact signal name (e.g. 'Order') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.2.1 (data structures, request/order signals).
      Concentrate on missing or wrong signal definitions, parameter types, and data structure
      completeness for the request/order family. Cross-check each signal name against Table 1.
      Always cite the exact signal name (e.g. 'Reject_Order', 'Cancel_Order') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.2.2 (user-side signals, taxi/driver interactions).
      Concentrate on missing user-side signals, wrong parameter types, and inconsistencies
      between the requirements text and 3.2.2.
      Always cite the exact signal name (e.g. 'Login', 'Log_Out') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.3.1 (operator-central signals, allocation flow).
      Concentrate on missing or wrong operator signals, allocation protocol gaps, and missing
      acknowledgments. Trace each signal against the requirements.
      Always cite the exact signal name (e.g. 'Allocate_car', 'Confirm') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.3.2 (operator-side state and acknowledgments).
      Concentrate on missing acknowledgments, wrong parameter types, and state-transition
      inconsistencies on the operator side.
      Always cite the exact signal name (e.g. 'Ack', 'Indicate_Alarm') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.4.1 (taxi MSC, signal sequencing on the car side).
      Concentrate on missing signals in the MSC, wrong sequencing, and missing reject/cancel
      paths. Cross-check that signals used here are defined upstream.
      Always cite the exact signal name (e.g. 'Reject_Order', 'ZoneInfo') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 3.4.2 (central MSC, signal sequencing on the central side).
      Concentrate on missing acknowledgments, wrong parameter types, missing cancel/voice
      signals, and inconsistencies between the central MSC and Table 1.
      Always cite the exact signal name (e.g. 'Cancel_Order', 'Confirm_Voice') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 4.1 (cross-actor MSC, end-to-end sequences).
      Concentrate on MSC completeness, missing timeout handling, signal ordering, and the
      consistency between 4.1 sequences and the signal definitions in 3.x and Tables.
      Always cite the exact signal name (e.g. 'Start_Voice', 'Available') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Section 4.2 (alternative MSC paths, error and timeout handling).
      Concentrate on missing alternative flows, error/timeout signals, and parameter
      inconsistencies in alternative sequences.
      Always cite the exact signal name (e.g. 'Not_Avail', 'Login_Rejected') in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
    - >
      YOUR ASSIGNED SCOPE: Table 1 (signal table, parameter types, missing signals).
      Concentrate on signals missing from Table 1 that are referenced in 3.x/4.x, wrong or
      missing parameter types, and signals listed in Table 1 but never used.
      Always cite the exact signal name as it appears in Table 1 in your evidence.
      Primary focus: assigned sections. Outside your focus you MAY log clear A/B defects
      only if you include precise location (section + page/table/msc) and evidence.
      Do not broaden search outside focus. Within your focus, log defects of any risk
      (A/B/C); outside your focus, only A/B.
