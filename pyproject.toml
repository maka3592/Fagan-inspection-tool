[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fagan-inspection-tool"
version = "0.1.0"
description = "Multi-Agent LLM-Based Formal Software Inspection Tool (Fagan Process)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fagan Inspection Research Project"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",  # Required for .xls (old Excel) gold standard files
    "PyYAML>=6.0.1",
    "pdfplumber>=0.11.0",
    "pandas>=2.2.0",
    "rapidfuzz>=3.6.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",  # For .env file loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
fagan = "fagan_tool.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
